name: CI with flaky test detection

# Every run draws a fresh chaos seed, so this builds up a real flaky history on the
# flaky-data branch. The schedule keeps it growing between pushes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write  # the detector pushes run records to the flaky-data branch

jobs:
  test:
    runs-on: ubuntu-24.04
    # Two timezones: test_reports fails only in PST, which the detector must call a real
    # environment-specific failure, not a flake.
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, PST]
    env:
      LAB_TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        id: tests
        continue-on-error: true
        run: >
          pytest -v
          --junitxml=.flaky/junit.xml
          --cov --cov-context=test --cov-report=term
          --cov-report=json:.flaky/coverage.json

      - name: Retry failed tests
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: pytest -v --last-failed --no-cov --junitxml=.flaky/junit-retry-1.xml

      # This repo exists to be flaky, so failures don't fail the job: the report is the point.
      - name: Detect flaky tests
        if: always() && steps.tests.outcome != 'skipped'
        uses: Shirojoufu/Flaky-Tests@ec75748fc1a393599e37fe60872e412d57e89ae8
        with:
          junit: .flaky/junit.xml
          retry-junit: .flaky/junit-retry-*.xml
          coverage: .flaky/coverage.json
          environment: ${{ matrix.tz }}
          # Worker subprocess code and data files: tests depend on them, but coverage can't see them.
          fingerprint-extra: lab/node.py lab/data/*.json
          python: python
